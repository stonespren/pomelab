# Nextcloud All-in-One, the media stack and the Cloudflare Tunnel that publishes them.
#
#   Cloudflare edge (HTTPS)
#     └── cloudflared (host network, outbound-only)
#           ├── http://localhost:11000  Nextcloud (AIO's Apache)
#           └── http://localhost:<port> the media apps
#
# setup.sh creates the tunnel and its routes, and fills in .env. Run it rather than
# starting this file by hand on a new server.
#
# Every app port is bound to MEDIA_BIND_IP (127.0.0.1 by default). They use each
# app's usual port, except qBittorrent, which moves to 8090 because AIO has 8080.
# setup.sh and scripts/configure-*.sh use the same ports, so change them together.
#
# The media apps all see the media tree at the same /data path, so imports can use
# hardlinks and no app needs remote path mappings:
#   /data/torrents/{incomplete,complete}
#   /data/media/{movies,tv,audiobooks,books}

name: pomelab

x-lsio-env: &lsio-env
  PUID: "${PUID:?run setup.sh}"
  PGID: "${PGID:?run setup.sh}"
  TZ: "${TZ:?run setup.sh}"

services:

  # ---------------------------------------------------------------------------
  # Nextcloud
  # ---------------------------------------------------------------------------
  # AIO starts and manages the rest of Nextcloud (Apache, PHP, PostgreSQL, Redis,
  # cron, backups) as separate containers. AIO hardcodes this container's name and
  # its volume's name, and its backups and updates break if either changes.
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    network_mode: bridge
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # The AIO admin interface. Reach it through an SSH tunnel, never the internet.
      - "127.0.0.1:8080:8080"
    environment:
      # AIO's Apache listens on the host's localhost, where cloudflared reaches it.
      APACHE_PORT: "11000"
      APACHE_IP_BINDING: "127.0.0.1"
      # AIO's domain check can't get through the tunnel.
      SKIP_DOMAIN_VALIDATION: "true"
      # Can't be changed after Nextcloud is installed.
      NEXTCLOUD_DATADIR: "${NEXTCLOUD_DATADIR:?run setup.sh}"
      NEXTCLOUD_UPLOAD_LIMIT: "${NEXTCLOUD_UPLOAD_LIMIT:?run setup.sh}"
      NEXTCLOUD_MAX_TIME: "${NEXTCLOUD_MAX_TIME:?run setup.sh}"
      NEXTCLOUD_MEMORY_LIMIT: "${NEXTCLOUD_MEMORY_LIMIT:?run setup.sh}"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    # Host networking reaches AIO's Apache and every app on localhost.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?run setup.sh}"

  # ---------------------------------------------------------------------------
  # Indexers
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      <<: *lsio-env
      PROWLARR__AUTH__APIKEY: "${PROWLARR_API_KEY:?run setup.sh}"
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/prowlarr:/config
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [media]

  # Has no authentication of its own, so it is only reachable on the Docker network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: "${TZ:?run setup.sh}"
    networks: [media]

  # ---------------------------------------------------------------------------
  # Downloads
  # ---------------------------------------------------------------------------
  # qBittorrent has no network of its own: all its traffic goes through gluetun,
  # whose firewall blocks everything outside the VPN, including when it drops.
  # Both only run under the "vpn" profile, which setup.sh turns on once
  # VPN_SERVICE_PROVIDER is set, so qBittorrent never runs on the home connection.
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    profiles: [vpn]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: "${TZ:?run setup.sh}"
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-}"
      VPN_TYPE: "${VPN_TYPE:-wireguard}"
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY:-}"
      WIREGUARD_PRESHARED_KEY: "${WIREGUARD_PRESHARED_KEY:-}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES:-}"
      OPENVPN_USER: "${OPENVPN_USER:-}"
      OPENVPN_PASSWORD: "${OPENVPN_PASSWORD:-}"
      SERVER_COUNTRIES: "${SERVER_COUNTRIES:-}"
      SERVER_CITIES: "${SERVER_CITIES:-}"
      FIREWALL_VPN_INPUT_PORTS: "${FIREWALL_VPN_INPUT_PORTS:-}"
      VPN_PORT_FORWARDING: "${VPN_PORT_FORWARDING:-off}"
      # Tells qBittorrent which port the VPN forwarded. Needs bypass_local_auth,
      # which only applies to gluetun and qBittorrent sharing this network stack.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8090/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8090/api/v2/app/setPreferences'
    ports:
      # qBittorrent's web UI, published here because it shares this container's network.
      - "${MEDIA_BIND_IP:?run setup.sh}:8090:8090"
    networks:
      media:
        # Other containers reach qBittorrent as qbittorrent:8090.
        aliases: [qbittorrent]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: [vpn]
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8090"
      TORRENTING_PORT: "${QBITTORRENT_TORRENT_PORT:?run setup.sh}"
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/qbittorrent:/config
      - ${MEDIA_DATA_DIR:?run setup.sh}:/data
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

  # Starts in test mode: it only logs what it would remove until
  # DECLUTTARR_TEST_RUN is set to false in .env.
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    profiles: [vpn]
    restart: unless-stopped
    depends_on: [sonarr, radarr, qbittorrent]
    environment:
      <<: *lsio-env
      LOG_LEVEL: INFO
      TEST_RUN: "${DECLUTTARR_TEST_RUN:?run setup.sh}"
      TIMER: "10"
      REMOVE_FAILED_DOWNLOADS: "true"
      REMOVE_FAILED_IMPORTS: "true"
      REMOVE_METADATA_MISSING: "true"
      REMOVE_SLOW: "true"
      REMOVE_STALLED: "true"
      SONARR: >
        - base_url: "http://sonarr:8989"
          api_key: "${SONARR_API_KEY:?run setup.sh}"
      RADARR: >
        - base_url: "http://radarr:7878"
          api_key: "${RADARR_API_KEY:?run setup.sh}"
      QBITTORRENT: >
        - base_url: "http://qbittorrent:8090"
          username: "${MEDIA_ADMIN_USER:?run setup.sh}"
          password: "${MEDIA_ADMIN_PASSWORD:?run setup.sh}"
    networks: [media]

  # ---------------------------------------------------------------------------
  # Automation
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      <<: *lsio-env
      SONARR__AUTH__APIKEY: "${SONARR_API_KEY:?run setup.sh}"
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/sonarr:/config
      - ${MEDIA_DATA_DIR:?run setup.sh}:/data
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [media]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      <<: *lsio-env
      RADARR__AUTH__APIKEY: "${RADARR_API_KEY:?run setup.sh}"
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/radarr:/config
      - ${MEDIA_DATA_DIR:?run setup.sh}:/data
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [media]

  # ---------------------------------------------------------------------------
  # Requests
  # ---------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    depends_on: [sonarr, radarr, jellyfin]
    environment:
      TZ: "${TZ:?run setup.sh}"
      PORT: "5055"
    volumes:
      # The image runs as UID 1000 whatever PUID is; setup.sh owns this directory to match.
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/seerr:/app/config
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    networks: [media]

  # Audiobook requests. Its setup wizard needs Prowlarr indexers and an
  # Audiobookshelf API token, so it is finished by hand (see NEXT_STEPS.md).
  readmeabook:
    image: ghcr.io/kikootwo/readmeabook:latest
    container_name: readmeabook
    restart: unless-stopped
    # Must stay above the 80s worst case for stopping its internal app, Redis and PostgreSQL.
    stop_grace_period: 90s
    depends_on: [prowlarr, audiobookshelf]
    environment:
      <<: *lsio-env
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/readmeabook/config:/app/config
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/readmeabook/cache:/app/cache
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/readmeabook/pgdata:/var/lib/postgresql/data
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/readmeabook/redis:/var/lib/redis
      - ${MEDIA_DATA_DIR:?run setup.sh}:/data
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:3030:3030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [media]

  # ---------------------------------------------------------------------------
  # Audible
  # ---------------------------------------------------------------------------
  # Downloads your Audible library into the Audiobooks folder. It has no web UI
  # or port, and only runs when you start it with `sudo ./scripts/audible-sync.sh`,
  # which signs in if needed, syncs once and exits. Nothing turns on its
  # profile, so `up` never starts it.
  libation:
    image: rmcrackan/libation:latest
    profiles: [libation]
    user: "${PUID:?run setup.sh}:${PGID:?run setup.sh}"
    environment:
      TZ: "${TZ:?run setup.sh}"
    volumes:
      # Accounts, settings and Libation's database
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/libation:/config
      # Libation saves books to /data, and warns unless /data itself is a mount.
      - ${MEDIA_DATA_DIR:?run setup.sh}/media/audiobooks:/data
    networks: [media]

  # ---------------------------------------------------------------------------
  # Playback
  # ---------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      <<: *lsio-env
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/jellyfin:/config
      - ${MEDIA_DATA_DIR:?run setup.sh}/media:/data/media
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks: [media]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    user: "${PUID:?run setup.sh}:${PGID:?run setup.sh}"
    environment:
      TZ: "${TZ:?run setup.sh}"
      PORT: "13378"
    volumes:
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/audiobookshelf/config:/config
      - ${MEDIA_CONFIG_DIR:?run setup.sh}/audiobookshelf/metadata:/metadata
      - ${MEDIA_DATA_DIR:?run setup.sh}/media:/data/media
    ports:
      - "${MEDIA_BIND_IP:?run setup.sh}:13378:13378"
    networks: [media]

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks:
  media:
    name: media
